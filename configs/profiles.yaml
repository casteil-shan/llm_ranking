profiles:
  smoke:
    description: "冒烟测试，约 20 题，15-30 分钟"
    suites:
      - reasoning
      - logic
      - accuracy
      - code
      - dialogue
      - agent

  fast:
    description: "快速评测，等同 smoke 题库"
    suites:
      - reasoning
      - logic
      - accuracy
      - code
      - dialogue
      - agent
