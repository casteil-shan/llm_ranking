[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ranking"
version = "0.1.0"
description = "Offline LLM benchmark framework with OpenAI-compatible API support"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.30.0",
    "pyyaml>=6.0",
    "click>=8.1",
    "rich>=13.0",
    "jinja2>=3.1",
]

[project.scripts]
agent-rank = "cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["agent_ranking*"]
